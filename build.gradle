import net.neoforged.moddevgradle.legacyforge.tasks.RemapJar
plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
}

configurations {
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += "-Xlint:-deprecation"
}

def generatedResources = file("src/generated")

sourceSets {
    main.resources {
        srcDir 'src/main/resources'
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { // GTM maven
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'appeng'
            includeGroup 'lu.kolja'
        }
    }

    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { // 'Ars'
        url 'https://maven.blamejared.com'
    }

    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdarkdev.xyz/snapshots/"
    }
    maven { // latvian.dev Maven (KubeJS and Rhino)
        url = "https://maven.latvian.dev/releases"
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content { // need to be specific here due to version overlaps
            includeGroup("com.tterrag.registrate")
        }
    }
    maven { // Patchouli, JEI
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven { // Curse Forge File
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { // EMI
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url = "https://maven.architectury.dev"
    }
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven { // 'Curios'
        url "https://maven.blamejared.com"
    }
    maven { // Geckolib
        url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        name = "ftbMavenReleases"
        url = uri("https://maven.ftb.dev/releases")
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }
sourceSets.main.resources { srcDir 'src/generated/resources' }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            // Recommended logging data for a userdev environment
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            logLevel = org.slf4j.event.Level.DEBUG
            sourceSet = sourceSets.main
        }
        client {
            client()
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        client1 {
            client()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArgument '--username'
            programArgument 'Player1'
        }
        client2 {
            client()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArgument '--username'
            programArgument 'Player2'
        }
        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        data {
            data()
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier.set('slim')
    manifest {
        attributes([
                "MixinConfigs": "phoenixcore.mixins.json",
                "Implementation-Vendor" : mod_author,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

mixin {
    add sourceSets.main, 'mixins.phoenixcore.refmap.json'
    config 'phoenixcore.mixins.json'
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")
    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')

    // JEI, EMI, Jade
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    modRuntimeOnly("curse.maven:building-gadgets-298187:6850495")
    modRuntimeOnly("curse.maven:kubejs-aisle-tool-1236291:7543948")
    modRuntimeOnly("curse.maven:phoenixs-chromatic-colors-1483210:7863211")
    modImplementation("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modImplementation("curse.maven:applied-energistics-2-223794:7148487")
    modImplementation("curse.maven:ex-pattern-provider-892005:7248944")
    modImplementation("curse.maven:glodium-957920:5226922")
    modImplementation("curse.maven:guideme-1173950:7127447")
    modImplementation("curse.maven:phoenixs-chromatic-colors-1483210:7980147")

    modRuntimeOnly("curse.maven:jade-324717:5390389")
    modCompileOnly("curse.maven:jade-324717:5390389")

    // Let JarJar natively handle your non-mod dependencies
    implementation 'javazoom:jlayer:1.0.1'
    jarJar('javazoom:jlayer:1.0.1')

    implementation 'org.jcodec:jcodec:0.2.5'
    jarJar('org.jcodec:jcodec:0.2.5')

    // GregTech and dependencies
    modImplementation "software.bernie.geckolib:geckolib-neoforge-1.20.1:${geckolib_version}"
    modImplementation "top.theillusivec4.curios:curios-forge:${curios_version}"
    modImplementation "com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}"
    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.latvian.mods:rhino-forge:${rhino_version}")
    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")
    modRuntimeOnly("dev.architectury:architectury-forge:${architectury_version}")
    modCompileOnly("dev.ftb.mods:ftb-library-forge:${ftblibrary_version}")
    modCompileOnly("dev.ftb.mods:ftb-teams-forge:${ftbteams_version}")

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
}

configurations.configureEach {
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0], // only specify major version of forge
            "minecraft_version": minecraft_version,
            "gtceu_version": gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('build') {
    dependsOn("spotlessApply")

    doLast {
        def localPath = "C:/Users/conno/Desktop/PFT Core/Phoenix-Forge-Technologies/mods"

        if (System.getProperty('os.name').toLowerCase().contains('windows') && file(localPath).exists()) {
            copy {
                from "build/libs"
                into localPath
                include "${archives_base_name}-${version}*.jar"
                exclude "*-sources.jar", "*-javadoc.jar"
            }
            println "SUCCESS: Spotless applied and Jar moved to local mods folder!"
        } else {
            println "Build complete. Local copy skipped (Not Windows or directory missing)."
        }
    }
}